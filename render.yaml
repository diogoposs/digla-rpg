# Servidor gratuito de testes. Neon é externo; DATABASE_URL é um segredo privado.
# Sem DATABASE_URL, o JSON no filesystem Free continua temporário.
services:
  - type: web
    name: digla-rpg
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DIGLA_DATA_DIR
        value: ./data
      - key: DIGLA_TEST_MODE
        value: '0'
      - key: DIGLA_TEMPORARY_SAVES
        value: '1'
      - key: DATABASE_URL
        sync: false
